# Minimal MACE training configuration (mace-torch 0.3.x), used as
#   mace_run_train --config mace_config.yaml
# Any option given on the command line overrides the value in this file.
# Option names follow the mace_run_train command-line flags (without "--").
name: MoS2_mace
seed: 2026
train_file: mace_train.xyz       # written by dft_to_extxyz.py --format mace
valid_fraction: 0.05
test_file: mace_test.xyz
# Keys used in the extxyz file (written explicitly so that ASE calculator
# results stored under "energy"/"forces" can never be mixed up with DFT labels)
energy_key: REF_energy
forces_key: REF_forces
stress_key: REF_stress
# Isolated-atom energies: preferred way is to include one frame per element
# with config_type=IsolatedAtom; "average" (least-squares estimate) is a quick
# fallback. For fine-tuning a foundation model the MACE docs use "estimated".
E0s: average
model: MACE
num_channels: 128
max_L: 1                         # 128x0e + 128x1o, the recommended default size
r_max: 5.0                       # Angstrom
correlation: 3
batch_size: 10
max_num_epochs: 300
stage_two: yes                   # raise the energy weight for the final epochs
start_stage_two: 240
ema: yes
ema_decay: 0.99
amsgrad: yes
default_dtype: float64           # default; float32 trains about 2x faster (MACE docs)
device: cuda
restart_latest: yes
