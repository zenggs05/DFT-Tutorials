# phonopy band.conf that writes a band.yaml usable by the "phonon website"
# (https://henriquemiranda.github.io/phononwebsite/ -> "Choose files" -> band.yaml)
# Run after the force constants are available (FORCE_SETS or FORCE_CONSTANTS):
#   phonopy --config band_phononwebsite.conf        (phonopy >= 4.x)
#   phonopy band_phononwebsite.conf                 (phonopy 2.x / 3.x)
# Example: zinc blende / diamond, POSCAR = conventional cubic cell, 2x2x2 supercell.
# Adapt DIM, PRIMITIVE_AXES and BAND to your structure (or reuse your own band.conf).
DIM = 2 2 2
PRIMITIVE_AXES = 0 1/2 1/2  1/2 0 1/2  1/2 1/2 0
BAND = 0 0 0  1/2 0 1/2  5/8 1/4 5/8,  3/8 3/8 3/4  0 0 0  1/2 1/2 1/2
BAND_LABELS = $\Gamma$ X U K $\Gamma$ L
BAND_POINTS = 51
EIGENVECTORS = .TRUE.       # required: the website animates the eigenvectors
BAND_CONNECTION = .TRUE.    # follow band crossings using eigenvectors
