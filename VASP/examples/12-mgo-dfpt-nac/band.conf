# phonopy settings: MgO phonon bands from VASP-DFPT force constants with NAC
ATOM_NAME = Mg O
DIM = 2 2 2
PRIMITIVE_AXES = 0 1/2 1/2  1/2 0 1/2  1/2 1/2 0
# read FORCE_CONSTANTS written by "phonopy-init --fc vasprun.xml"
FORCE_CONSTANTS = READ
# non-analytical term correction; needs the BORN file (phonopy >= 4 switches it
# on automatically when BORN exists)
NAC = .TRUE.
BAND = 0 0 0  1/2 0 1/2  1/2 1/4 3/4  3/8 3/8 3/4  0 0 0  1/2 1/2 1/2
BAND_LABELS = $\Gamma$ X W K $\Gamma$ L
BAND_POINTS = 101
